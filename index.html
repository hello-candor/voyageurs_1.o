<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bryan's 40th - Sept 18-20</title>
  <!-- PWA Settings -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1E4472" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Voyageurs" />
  <link rel="apple-touch-icon" href="/assets/voyageurs-icon.png" />

  <!-- Favicon -->
  <link rel="icon" href="/assets/voyageurs-icon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    // Polyfill process.env for browser environment
    window.process = {
      env: {
        NODE_ENV: 'production',
        // API Key availability handled externally
        API_KEY: ''
      }
    };
  </script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script>
    tailwind.config = {
      // This is the critical line for manual toggling
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            med: {
              blue: 'var(--color-primary)',       /* #1E4472 */
              lightBlue: 'var(--color-primary-light)', /* #AEC0D8 */
              sand: 'var(--color-bg)',            /* #F5F2EB */
              terracotta: 'var(--color-accent)',  /* #D67252 */
              olive: 'var(--color-success)',      /* #8A9A5B */
            }
          },
          fontFamily: {
            serif: ['"Voyage"', '"Cormorant Garamond"', 'serif'],
            sans: ['"Inter"', '"Montserrat"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --color-primary: #1E4472;
      --color-primary-light: #AEC0D8;
      --color-bg: #F5F2EB;
      --color-accent: #D67252;
      --color-success: #8A9A5B;
    }

    .dark {
      --color-primary: #AEC0D8;
      --color-bg: #111827;
      /* Deep dark background */
      --color-accent: #b85a3a;     /* Darker terracotta for dark mode CTAs */
      --color-success: #6b7a44;   /* Darker olive for dark mode success/complete */
    }

    html {
      scroll-padding-top: 100px;
    }

    body {
      background-color: var(--color-bg) !important;
      color: var(--color-primary);
      transition: background-color 0.3s ease;
    }

    .scroll-smooth {
      scroll-behavior: smooth;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Leaflet overrides */
    .leaflet-container {
      width: 100%;
      height: 100%;
      background-color: #f0f0f0;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0;
    }

    @keyframes subtle-pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .animate-subtle-pulse {
      animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?external=react",
    "react-dom/server": "https://esm.sh/react-dom@18.2.0/server?external=react",
    "react/": "https://esm.sh/react@18.2.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "leaflet": "https://esm.sh/leaflet@1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@4.2.1?external=react,react-dom,leaflet",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "firebase/app": "https://esm.sh/firebase@^12.7.0/app",
    "firebase/storage": "https://esm.sh/firebase@^12.7.0/storage",
    "firebase/firestore": "https://esm.sh/firebase@^12.7.0/firestore",
    "dompurify": "https://esm.sh/dompurify@3.0.6",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom"
  }
}
</script>
</head>

<body class="scroll-smooth antialiased transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
